<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1110" viewBox="0 0 1400 1110" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
    <style>
      .box{fill:#f4f6f8;stroke:#333;stroke-width:1.5}
      .tbd{fill:#fff8e6;stroke:#b7791f;stroke-width:1.5;stroke-dasharray:6 4}
      .t{font-size:15px;font-weight:bold;fill:#111;text-anchor:middle}
      .s{font-size:12.5px;fill:#333;text-anchor:middle}
      .l{font-size:12px;fill:#333}
      .pwr{stroke:#c0392b;stroke-width:2.5;fill:none}
      .i2c{stroke:#1f6fb2;stroke-width:2.5;fill:none}
      .uart{stroke:#1e8449;stroke-width:2.5;fill:none}
      .spi{stroke:#7d3c98;stroke-width:2.5;fill:none}
      .rf{stroke:#555;stroke-width:2;fill:none;stroke-dasharray:7 5}
      .panel{fill:none;stroke:#999;stroke-width:1.2}
      .ph{font-size:17px;font-weight:bold;fill:#222}
    </style>
  </defs>
  <rect width="1400" height="1110" fill="#fff"/>
  <text x="700" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">Asteria CanSat – electrical block diagram</text>

  <!-- FLIGHT PANEL -->
  <rect class="panel" x="20" y="55" width="1360" height="710" rx="8"/>
  <text class="ph" x="36" y="80">CanSat (flight)</text>

  <!-- power column -->
  <rect class="box" x="40" y="105" width="220" height="56" rx="5"/>
  <text class="t" x="150" y="128">LiPo battery</text><text class="s" x="150" y="148">3.7 V, 600 mAh</text>
  <rect class="box" x="40" y="205" width="220" height="60" rx="5"/>
  <text class="t" x="150" y="228">Master power switch</text><text class="s" x="150" y="248">+ charger (on SX1262 board)</text>
  <rect class="box" x="40" y="320" width="220" height="62" rx="5"/>
  <text class="t" x="150" y="344">Pololu U3V40F5 5 V boost</text><text class="s" x="150" y="364">4G HAT needs 5 V; ~4 A input</text>
  <rect class="box" x="40" y="425" width="220" height="44" rx="5"/>
  <text class="t" x="150" y="452">1000 µF capacitor</text>

  <path class="pwr" d="M150,161 V205" marker-end="url(#a)"/>
  <path class="pwr" d="M150,265 V320" marker-end="url(#a)"/>
  <path class="pwr" d="M150,382 V425" marker-end="url(#a)"/>
  <path class="pwr" d="M150,469 V560" marker-end="url(#a)"/>
  <text class="l" x="158" y="520">5 V, ~1 A TX bursts</text>
  <text class="l" x="266" y="226">VSYS</text><text class="l" x="266" y="254">3.5–4.2 V</text>

  <!-- Omnibus with Pico + LoRa -->
  <rect x="360" y="100" width="420" height="330" rx="8" fill="#fbfcfd" stroke="#333" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text class="s" x="570" y="122" font-style="italic">Pimoroni Pico Omnibus (94 × 52 mm)</text>
  <rect class="box" x="390" y="140" width="360" height="160" rx="5" style="fill:#e8f1e4"/>
  <text class="t" x="570" y="172">Raspberry Pi Pico 2 (RP2350)</text>
  <text class="s" x="570" y="196">flight computer – MicroPython</text>
  <text class="s" x="570" y="218">flash: 4G send buffer</text>
  <text class="s" x="570" y="240">launch detection, 1 Hz telemetry packets</text>
  <text class="s" x="570" y="270">3V3 OUT → all sensors + GPS (≤ 300 mA)</text>
  <rect class="box" x="390" y="335" width="360" height="75" rx="5"/>
  <text class="t" x="570" y="362">Waveshare SX1262 LoRa module</text>
  <text class="s" x="570" y="384">433 MHz, freq. set in software, 10 dBm max</text>
  <path class="spi" d="M570,300 V335" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="l" x="580" y="322">SPI + BUSY, DIO1, RESET</text>

  <rect class="box" x="470" y="465" width="200" height="50" rx="5"/>
  <text class="t" x="570" y="486">433 MHz spring antenna</text><text class="s" x="570" y="505">≤ 30 mm, bottom cap</text>
  <path class="rf" d="M570,410 V465"/>
  <text class="l" x="580" y="442">IPEX</text>

  <!-- UART1 to 4G -->
  <path class="uart" d="M390,280 H300 V560" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="l" x="292" y="470" transform="rotate(-90 292 470)">UART1 + PWRKEY</text>
  <rect class="box" x="40" y="560" width="280" height="90" rx="5"/>
  <text class="t" x="180" y="586">Waveshare A7670E 4G HAT</text>
  <text class="s" x="180" y="608">LTE Cat-1, 2G off, PAYG SIM</text>
  <text class="s" x="180" y="628">all streams at full rate (~3.4 KB/s)</text>
  <rect class="box" x="40" y="690" width="280" height="50" rx="5"/>
  <text class="t" x="180" y="711">LTE FPC antenna</text><text class="s" x="180" y="730">inside PETG shell wall</text>
  <path class="rf" d="M180,650 V690"/>

  <!-- UART0 to GPS -->
  <path class="uart" d="M750,250 H820 V600" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="l" x="828" y="430">UART0</text>
  <rect class="box" x="690" y="600" width="260" height="80" rx="5"/>
  <text class="t" x="820" y="626">ATGM336H GPS</text>
  <text class="s" x="820" y="647">+ patch antenna, 1 Hz</text>
  <text class="s" x="820" y="667">position, time (sun angle), drift</text>

  <!-- I2C chain -->
  <text class="t" x="1170" y="92" style="font-size:14px">I²C bus – STEMMA QT daisy chain, 3.3 V</text>
  <path class="i2c" d="M750,180 H900 V131 H1000" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="l" x="800" y="172">I²C0</text>
  <text class="l" x="826" y="122">QT-to-socket lead</text>
  <g>
    <rect class="box" x="1000" y="105" width="340" height="52" rx="5"/>
    <text class="t" x="1170" y="126">AS7341 spectral, 10 channels</text><text class="s" x="1170" y="145">0x39 · faces up, PTFE diffuser</text>
    <rect class="box" x="1000" y="172" width="340" height="52" rx="5"/>
    <text class="t" x="1170" y="193">LTR390 UV + ambient light</text><text class="s" x="1170" y="212">0x53 · faces up, PTFE diffuser</text>
    <rect class="box" x="1000" y="239" width="340" height="52" rx="5"/>
    <text class="t" x="1170" y="260">SHT45 temperature + humidity</text><text class="s" x="1170" y="279">0x44 · primary mission</text>
    <rect class="box" x="1000" y="306" width="340" height="52" rx="5"/>
    <text class="t" x="1170" y="327">BMP388 pressure</text><text class="s" x="1170" y="346">0x77 · primary mission</text>
    <rect class="box" x="1000" y="373" width="340" height="52" rx="5"/>
    <text class="t" x="1170" y="394">LSM6DSO32 accel ±32 g + gyro</text><text class="s" x="1170" y="413">0x6A · launch detection, 20 g, swing</text>
    <rect class="box" x="1000" y="440" width="340" height="52" rx="5"/>
    <text class="t" x="1170" y="461">BNO085 orientation (fusion)</text><text class="s" x="1170" y="480">0x4A · tilt correction</text>
  </g>
  <path class="i2c" d="M1020,157 V172 M1020,224 V239 M1020,291 V306 M1020,358 V373 M1020,425 V440"/>

    <!-- legend -->
  <g>
  <rect x="1000" y="560" width="340" height="160" rx="6" fill="#fff" stroke="#bbb"/>
  <text x="1016" y="584" font-size="14" font-weight="bold">Key</text>
  <path class="pwr" d="M1016,606 H1066"/><text class="l" x="1076" y="610">Power</text>
  <path class="i2c" d="M1016,630 H1066"/><text class="l" x="1076" y="634">I²C (STEMMA QT)</text>
  <path class="uart" d="M1016,654 H1066"/><text class="l" x="1076" y="658">UART</text>
  <path class="spi" d="M1016,678 H1066"/><text class="l" x="1076" y="682">SPI</text>
  <path class="rf" d="M1016,702 H1066"/><text class="l" x="1076" y="706">RF / antenna</text>

  </g>

  <!-- GROUND PANEL -->
  <rect class="panel" x="20" y="790" width="1360" height="270" rx="8"/>
  <text class="ph" x="36" y="815">Ground station (ground support equipment)</text>

  <rect class="box" x="60" y="840" width="280" height="70" rx="5"/>
  <text class="t" x="200" y="866">Mobile network + internet</text><text class="s" x="200" y="887">UDP / MQTT, sequence numbers</text>
  <rect class="box" x="450" y="840" width="240" height="70" rx="5"/>
  <text class="t" x="570" y="866">SX1262 433 MHz LoRa</text><text class="s" x="570" y="887">+ antenna</text>
  <rect class="box" x="800" y="840" width="240" height="70" rx="5" style="fill:#e8f1e4"/>
  <text class="t" x="920" y="866">Raspberry Pi Pico 2</text><text class="s" x="920" y="887">ground receiver</text>
  <rect class="box" x="1110" y="840" width="250" height="70" rx="5"/>
  <text class="t" x="1235" y="866">Ground reference sensors</text><text class="s" x="1235" y="887">AS7341 + LTR390 (same as flight)</text>
  <rect class="box" x="450" y="960" width="590" height="60" rx="5"/>
  <text class="t" x="745" y="984">Laptop</text><text class="s" x="745" y="1004">live plots, logging, merges LoRa + 4G + ground reference data</text>

  <path class="spi" d="M690,875 H800" marker-end="url(#a)" marker-start="url(#a)"/><text class="l" x="728" y="868">SPI</text>
  <path class="i2c" d="M1110,875 H1040" marker-end="url(#a)"/><text class="l" x="1058" y="868">I²C</text>
  <path class="uart" d="M920,910 V960" marker-end="url(#a)"/><text class="l" x="928" y="940">USB serial</text>
  <path class="rf" d="M200,910 V990 H450" marker-end="url(#a)"/>

  <!-- radio links -->
  <path class="rf" d="M570,515 V840" marker-end="url(#a)"/>
  <text class="l" x="580" y="560">LoRa telemetry, 1 Hz</text>
  <text class="l" x="580" y="576">T, P + downsampled science</text>
  <text class="l" x="580" y="592">433 MHz, 10 mW ERP</text>
  <path class="rf" d="M110,740 V840" marker-end="url(#a)"/>
  <text class="l" x="118" y="782">4G full-rate data</text>

  <text x="1380" y="1090" font-size="11" fill="#777" text-anchor="end">Figure generated with Claude Code (Anthropic), 25 Nov 2026. I²C addresses are Adafruit defaults; GPIO pin map: docs/pin_map.md.</text>
  <path class="pwr" d="M260,235 H390" marker-end="url(#a)"/>
</svg>
